; Standalone envs for the BleOTA example -- not part of test/ci_build, since
; the custom partition table here (../ota/partitions.csv) isn't something
; every user of the library should get by default. See ../../BleOTA.md.
;
; src_dir points at this folder itself (not the PlatformIO default ./src) so
; OTAUpdate.ino can stay directly in examples/OTAUpdate/ -- required for the
; Arduino IDE/Library Manager to recognise it as an example sketch.
[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    h2zero/NimBLE-Arduino
    ; symlink://, not a bare path -- a bare local path makes PlatformIO deep-copy
    ; the whole library tree into .pio/libdeps, which recurses into this repo's
    ; *other* example/test .pio build directories and explodes disk usage when
    ; more than one of them has already been built (hit this firsthand: two
    ; example projects both using a bare "../../" filled 15GB before erroring
    ; out with ENOSPC). symlink:// avoids the copy entirely.
    symlink://../../
build_flags =
    -D BLE_GAMEPAD_DEBUG=0
monitor_speed = 115200
board_build.partitions = ../ota/partitions.csv

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitc-02
upload_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 115200
