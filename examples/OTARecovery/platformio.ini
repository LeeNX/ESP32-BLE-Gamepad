; Minimal factory-recovery image -- see OTARecovery.ino for what it is and
; how to flash it into the `factory` slot specifically (not the normal
; `pio run -t upload`, which targets the default app offset).
;
; src_dir points at this folder itself (not the PlatformIO default ./src) so
; OTARecovery.ino can stay directly in examples/OTARecovery/ -- required for
; the Arduino IDE/Library Manager to recognise it as an example sketch.
[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    h2zero/NimBLE-Arduino
    ; symlink://, not a bare path -- see the matching comment in
    ; ../OTAUpdate/platformio.ini. A bare local path deep-copies the whole
    ; library tree into .pio/libdeps, which recurses into this repo's other
    ; example/test .pio build directories and can explode disk usage.
    symlink://../../
build_flags =
    -D BLE_GAMEPAD_DEBUG=0
monitor_speed = 115200
board_build.partitions = ../ota/partitions.csv

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitc-02
upload_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 115200
